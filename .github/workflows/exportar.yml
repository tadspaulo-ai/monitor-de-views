name: Exportar dados do YouTube

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exportar videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL: ${{ secrets.YT_CHANNEL }}
        run: python exportar_youtube.py
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-videos
          path: youtube_videos.json
          retention-days: 3
