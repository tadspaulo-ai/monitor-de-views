name: Monitor de Views

on:
  schedule:
    - cron: "7 * * * *"   # toda hora, no minuto 7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar views e enviar relatorio
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL: ${{ secrets.YT_CHANNEL }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          VIRAL_POR_HORA: ${{ vars.VIRAL_POR_HORA }}
          VIRAL_TOTAL: ${{ vars.VIRAL_TOTAL }}
          MODO_RELATORIO: ${{ vars.MODO_RELATORIO }}
        run: python monitor.py
      - name: Guardar numeros para a proxima comparacao
        if: always()
        run: |
          if [ -f estado.json ]; then
            git config user.name "monitor-de-views"
            git config user.email "monitor-de-views@users.noreply.github.com"
            git add estado.json
            if ! git diff --cached --quiet; then
              git commit -m "Atualiza estado"
              git push
            fi
          fi
